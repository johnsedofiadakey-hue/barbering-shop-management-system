name: Test

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Prepare isolated test environment
        run: |
          cp .env.example .env.dev
          sed -i 's/your-super-secret-key-here/ci-only-secret-key/' .env.dev
          sed -i 's/mydb/barbermanager_ci/g' .env.dev
          sed -i 's/myuser/barbermanager_ci/g' .env.dev
          sed -i 's/mypassword/barbermanager_ci/g' .env.dev
          sed -i 's/SMS_BACKEND=twilio/SMS_BACKEND=console/' .env.dev

      - name: Run backend tests
        run: docker compose -f docker-compose.dev.yml --env-file .env.dev run --rm backend python manage.py test

      - name: Check for missing migrations
        run: docker compose -f docker-compose.dev.yml --env-file .env.dev run --rm backend python manage.py makemigrations --check --dry-run
