services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '5433:5432' # Exposed for DBeaver database analysis (5433 on host to avoid clashing with other local Postgres)

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379' # 6380 on host to avoid clashing with other local Redis

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    environment:
      - RUN_MIGRATIONS=1
    depends_on:
      - db
      - redis
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
      - media_data:/app/media
    command: python manage.py runserver 0.0.0.0:8000

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: celery -A config worker -l info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: celery -A config beat -l info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules # Doing this unsyncs node_modules folder from host machine
    ports:
      - '3002:5173' # 3002 on host to avoid clashing with other local dev servers
    command: npm run dev -- --host

volumes:
  postgres_data:
  media_data:
